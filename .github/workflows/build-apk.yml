name: Build debug APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autotag-release
  cancel-in-progress: false

jobs:
  build:
    # Pinned: GitHub-hosted 24.04 ships a full Android SDK
    # (platform android-34, build-tools, cmdline-tools, ANDROID_SDK_ROOT),
    # so no setup-android step is needed. Avoids sdkmanager exit-code-1
    # failures seen with android-actions/setup-android@v3.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.7

      # Auto-tag: push main -> create v(max+1) so every green build
      # ships a public Release (no manual `git tag vN` needed).
      # Skipped on tag runs and manual dispatches on other refs.
      - name: Auto-tag vN (main only)
        id: autotag
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags origin
          MAX=$(git tag --list "v*" | sed 's/^v//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          if [ -z "$MAX" ]; then MAX=0; fi
          NEXT=$((MAX + 1))
          TAG="v$NEXT"
          echo "Latest tag number: $MAX -> creating $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping push"
          else
            git tag "$TAG" HEAD
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "num=$NEXT" >> "$GITHUB_OUTPUT"

      # versionCode convention: tag number for releases (vN -> N).
      # The in-app updater compares the latest release tag number
      # against the installed versionCode.
      - name: Resolve build number
        id: ver
        run: |
          if [ -n "${{ steps.autotag.outputs.num }}" ]; then
            echo "num=${{ steps.autotag.outputs.num }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "num=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "num=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      # Stable signature: Uses the committed debug.keystore so every release
      # and local build carries the EXACT same certificate. Prevents Android
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE and ensures in-app updater works.
      - name: Restore stable debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp keystore/debug.keystore "$HOME/.android/debug.keystore"
          echo "Restored stable debug keystore from repo"

      # Matcher / text-normalization logic is pure JVM: run it before the APK
      # build so a broken keyword match fails fast instead of shipping.
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        env:
          BUILD_NUMBER: ${{ steps.ver.outputs.num }}
        run: gradle assembleDebug --stacktrace

      # Fails the build if the APK is not signed with the stable keystore or
      # if the signer drifted from expected SHA-256.
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-certs.txt
          APK_SHA=$(grep -m1 'certificate SHA-256 digest:' /tmp/apk-certs.txt | awk '{print tolower($NF)}' | tr -d ':')
          echo "APK signer SHA-256: $APK_SHA"
          KS_SHA=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | grep -m1 'SHA256:' | awk '{print tolower($NF)}' | tr -d ':')
          echo "Keystore cert SHA-256: $KS_SHA"
          if [ -z "$APK_SHA" ] || [ "$APK_SHA" != "$KS_SHA" ]; then
            echo "::error::APK is not signed with the stable keystore (apksigner=$APK_SHA keystore=$KS_SHA)"
            exit 1
          fi
          EXPECTED="162de3ba4d8a6c943e04080bbfe0cd5958d6482124fc2fd8610e2de3c62e8d82"
          if [ "$APK_SHA" != "$EXPECTED" ]; then
            echo "::error::Signer drifted: expected $EXPECTED got $APK_SHA"
            exit 1
          fi
          echo "Signature OK — matches stable keystore"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Main push (via autotag) OR tag push -> public Release so the
      # in-app updater (releases/latest, no login) can find the APK.
      # Idempotent: second run triggered by the tag push just clobbers.
      - name: Publish Release
        if: steps.autotag.outputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ steps.autotag.outputs.tag }}" ]; then
            TAG="${{ steps.autotag.outputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "Publishing $TAG"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "$TAG" \
            --notes "Auto build $TAG (${GITHUB_SHA::7})" || \
          gh release upload "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk --clobber
