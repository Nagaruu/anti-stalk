name: Build debug APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # Pinned: GitHub-hosted 24.04 ships a full Android SDK
    # (platform android-34, build-tools, cmdline-tools, ANDROID_SDK_ROOT),
    # so no setup-android step is needed. Avoids sdkmanager exit-code-1
    # failures seen with android-actions/setup-android@v3.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.7

      # versionCode convention: tag number for releases (vN -> N),
      # run number for plain branch builds. The in-app updater compares
      # the latest release tag number against the installed versionCode.
      - name: Resolve build number
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "num=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "num=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        env:
          BUILD_NUMBER: ${{ steps.ver.outputs.num }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Tag push (vN) -> public Release so the in-app updater
      # (releases/latest, no login) can find and download the APK.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "${GITHUB_REF_NAME}" \
            --notes "Auto build ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" || \
          gh release upload "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/debug/app-debug.apk --clobber
