name: Generate stable debug keystore

# ONE-TIME setup. Debug builds are signed with $HOME/.android/debug.keystore,
# which ephemeral CI runners generate RANDOMLY on first use. Without this file
# every release ships a different signature and Android refuses to update
# (INSTALL_FAILED_UPDATE_INCOMPATIBLE) — the in-app updater can never work.
#
# How to use (once):
#   1. Actions -> "Generate stable debug keystore" -> Run workflow
#   2. Download the artifact "debug-keystore"
#   3. Base64 it and store as repository secret DEBUG_KEYSTORE_B64
#   4. Delete the artifact (keep a private offline backup of the keystore!)
#
# Credentials are the standard Android debug defaults so no Gradle change is
# needed: alias androiddebugkey, store/key password android.
#
# NEVER log the keystore or its base64: this repository is public and so are
# the workflow logs. The artifact download requires a signed-in account.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v6
        with:
          name: debug-keystore
          path: debug.keystore
          retention-days: 7
